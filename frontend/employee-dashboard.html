<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background-color: #f0f2f5; }

    .sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 230px;
  height: 100vh;
  background: #1e293b;
  padding: 25px;
}

.sidebar h2 {
  color: #fff;
  text-align: center;
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  padding: 12px 15px;
  color: #cbd5e1;
  text-decoration: none;
  border-radius: 6px;
  margin-bottom: 8px;
}

.sidebar a:hover,
.sidebar a.active {
  background: #334155;
  color: #fff;
}

.sidebar button.logout {
  margin-top: 30px;
  background: #dc2626;
  color: #fff;
}

.sidebar button.logout:hover {
  background: #b91c1c;
}

    .main { margin-left:220px; padding:20px; }

    .cards { display:flex; gap:20px; margin-bottom:30px; }
    .card { background:white; padding:20px; flex:1; border-radius:8px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.1); }

    .chart-card { background:white; padding:20px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); max-width:400px; margin-bottom:30px; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Employee Portal</h2>
  <a href="#" id="dashboardLink" class="active" onclick="showSection('dashboard')">Dashboard</a>
  <a href="#" id="tasksLink" onclick="showSection('tasks'); filterTasks('Pending')">Tasks</a>
  <a href="employee-profile.html">Profile</a>
  <a href="employee-documents.html">Documents</a>
  <a href="index.html" class="logout">Logout</a>
</div>

<div class="main">
  <!-- Dashboard Section -->
  <div id="dashboard">
    <h1>Dashboard Overview</h1>
    <div class="cards">
      <div class="card" style="cursor: pointer;" onclick="showSection('tasks'); filterTasks('all')">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
      </div>
      <div class="card" style="cursor: pointer;" onclick="showSection('tasks'); filterTasks('Pending')">
        <h3>Pending Tasks</h3>
        <p id="tasksPending">0</p>
      </div>
      <div class="card" style="cursor: pointer;" onclick="showSection('tasks'); filterTasks('Completed')">
        <h3>Completed Tasks</h3>
        <p id="tasksCompleted">0</p>
      </div>
    </div>

    <div class="chart-card">
      <h3>Task Completion Chart</h3>
      <canvas id="taskChart" style="max-width:200px;"></canvas>
    </div>
  </div>

  <!-- Tasks Section -->
  <div id="tasks" style="display: none;">
    <h1>My Tasks</h1>
    
    <!-- Filter Buttons -->
    <div style="margin-bottom: 20px;">
      <button onclick="filterTasks('all')" style="margin-right:10px; padding:8px 16px; border:none; border-radius:4px; cursor:pointer; background:#3b82f6; color:white;">All Tasks</button>
      <button onclick="filterTasks('Pending')" style="margin-right:10px; padding:8px 16px; border:none; border-radius:4px; cursor:pointer; background:#f59e0b; color:white;">Pending</button>
      <button onclick="filterTasks('Completed')" style="padding:8px 16px; border:none; border-radius:4px; cursor:pointer; background:#22c55e; color:white;">Completed</button>
    </div>

    <!-- Tasks Table -->
    <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); margin-bottom:30px;">
      <h3 id="taskListTitle">Pending Tasks</h3>
      <table style="width:100%; border-collapse: collapse;">
        <thead>
          <tr style="background:#f1f5f9;">
            <th style="padding:10px; text-align:left; background-color: #3b82f6;" >Title</th>
            <th style="padding:10px; text-align:left; background-color: #3b82f6;">Description</th>
            <th style="padding:10px; text-align:left; background-color: #3b82f6;">Priority</th>
            <th style="padding:10px; text-align:left; background-color: #3b82f6;">Due Date</th>
            <th style="padding:10px; text-align:left; background-color: #3b82f6;">Status</th>
            <th style="padding:10px; text-align:left; background-color: #3b82f6;">Action</th>
          </tr>
        </thead>
        <tbody id="tasksTableBody">
          <tr><td colspan="6" style="text-align:center; padding:20px;">Loading tasks...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token) {
  window.location.href = "index.html";
}

// 🔐 Only Employee allowed
if (role !== "Employee") {
  window.location.href = "dashboard.html";
}

let allTasks = [];
let chartInstance = null;

// Load tasks
function loadTasks() {
  fetch("http://localhost:4000/tasks/my-tasks", {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(tasks => {
    // Sort tasks by ID in ascending order
    allTasks = tasks.sort((a, b) => a.id - b.id);
    
    const totalTasks = allTasks.length;
    const pendingTasks = allTasks.filter(t => t.status === "Pending").length;
    const completedTasks = allTasks.filter(t => t.status === "Completed").length;

    document.getElementById("totalTasks").innerText = totalTasks;
    document.getElementById("tasksPending").innerText = pendingTasks;
    document.getElementById("tasksCompleted").innerText = completedTasks;

    // Render tasks table
    renderTasksTable(allTasks);
    
    // Load Chart
    loadChart(completedTasks, pendingTasks);
  })
  .catch(err => {
    console.error("Error loading tasks:", err);
    document.getElementById("tasksTableBody").innerHTML = 
      '<tr><td colspan="6" style="text-align:center; padding:20px; color:#ef4444;">Error loading tasks</td></tr>';
  });
}

function renderTasksTable(tasks) {
  const tbody = document.getElementById("tasksTableBody");
  
  if (tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">No tasks found</td></tr>';
    return;
  }

  tbody.innerHTML = tasks.map(task => `
    <tr style="border-bottom: 1px solid #e2e8f0;">
      <td style="padding:10px; font-weight:500;">${task.title}</td>
      <td style="padding:10px;">${task.description || 'N/A'}</td>
      <td style="padding:10px;">
        <span style="background:${getPriorityColor(task.priority)}; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">
          ${task.priority}
        </span>
      </td>
      <td style="padding:10px;">${task.due_date ? new Date(task.due_date).toLocaleDateString() : 'N/A'}</td>
      <td style="padding:10px;">
        <span style="background:${task.status === 'Completed' ? '#22c55e' : '#f59e0b'}; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">
          ${task.status}
        </span>
      </td>
      <td style="padding:10px;">
        ${task.status === 'Pending' ? 
          `<button onclick="markComplete(${task.id})" style="background:#22c55e; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Mark Complete</button>` :
          `<span style="color:#22c55e;">✓ Done</span>`
        }
      </td>
    </tr>
  `).join('');
}

function getPriorityColor(priority) {
  switch(priority) {
    case 'High': return '#ef4444';
    case 'Medium': return '#f59e0b';
    case 'Low': return '#3b82f6';
    default: return '#6b7280';
  }
}

function filterTasks(status) {
  let filteredTasks = allTasks;
  let title = "All Tasks";
  
  if (status === 'Pending') {
    filteredTasks = allTasks.filter(t => t.status === 'Pending');
    title = "Pending Tasks";
  } else if (status === 'Completed') {
    filteredTasks = allTasks.filter(t => t.status === 'Completed');
    title = "Completed Tasks";
  }
  
  document.getElementById("taskListTitle").innerText = title;
  renderTasksTable(filteredTasks);
}

function markComplete(taskId) {
  if (!confirm("Mark this task as completed?")) return;
  
  fetch(`http://localhost:4000/tasks/${taskId}/status`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ status: 'Completed' })
  })
  .then(res => res.json())
  .then(() => {
    loadTasks(); // Reload tasks
  })
  .catch(err => {
    alert("Error updating task status");
    console.error(err);
  });
}

function loadChart(completed, pending) {
  const ctx = document.getElementById("taskChart");
  
  // Destroy existing chart if any
  if (chartInstance) {
    chartInstance.destroy();
  }
  
  chartInstance = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:['Completed','Pending'],
      datasets:[{ 
        data:[completed, pending], 
        backgroundColor:['#22c55e','#f59e0b'] 
      }]
    },
    options:{ responsive:true }
  });
}

// Show/Hide sections
function showSection(section) {
  // Hide all sections
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('tasks').style.display = 'none';
  
  // Remove active class from all sidebar links
  document.getElementById('dashboardLink').classList.remove('active');
  document.getElementById('tasksLink').classList.remove('active');
  
  // Show selected section and set active link
  if (section === 'dashboard') {
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('dashboardLink').classList.add('active');
  } else if (section === 'tasks') {
    document.getElementById('tasks').style.display = 'block';
    document.getElementById('tasksLink').classList.add('active');
  }
}

// Load tasks on page load
loadTasks();
</script>

</body>
</html>
