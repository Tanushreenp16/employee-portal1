<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>EMPLOYEE PORTAL</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="employees.html">Employees</a>
  <a href="documents.html">Documents</a>
  <a href="tasks-admin.html" class="active">Tasks</a>
  <a href="profile.html">Profile</a>
  <a href="#" class="logout" onclick="logout()">Logout</a>
</div>

<!-- Main Content -->
<div class="main">
  <h1>Task Management</h1>

  <button class="btn-secondary" onclick="openTaskForm()" style="margin-bottom: 20px;">+ Assign New Task</button>

  <!-- Tasks Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Employee</th>
        <th>Priority</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tasksTable">
      <tr><td colspan="7">Loading tasks...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal Form -->
<div id="taskModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeTaskForm()">&times;</span>
    <h3>Assign Task to Employee</h3>

    <div class="grid">
      <input id="taskTitle" placeholder="Task Title" style="grid-column: 1 / -1;">
      <textarea id="taskDescription" placeholder="Task Description" rows="3" style="grid-column: 1 / -1;"></textarea>
      
      <select id="taskEmployee">
        <option value="">Select Employee</option>
      </select>
      
      <select id="taskPriority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      
      <input id="taskDueDate" type="date">
    </div>

    <div class="form-actions">
      <button onclick="assignTask()">Assign Task</button>
      <button class="btn-secondary" onclick="closeTaskForm()">Cancel</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token) {
  window.location.href = "index.html";
}

if (role === "Employee") {
  window.location.href = "employee-dashboard.html";
}

const API_TASKS = "http://localhost:4000/tasks";
const API_EMPLOYEES = "http://localhost:4000/employees/list";
let allEmployees = [];

function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

// Load employees for dropdown
function loadEmployees() {
  fetch(API_EMPLOYEES, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(employees => {
    allEmployees = employees;
    const select = document.getElementById("taskEmployee");
    select.innerHTML = '<option value="">Select Employee</option>';
    
    employees.forEach(emp => {
      select.innerHTML += `<option value="${emp.id}">${emp.name} - ${emp.email}</option>`;
    });
  });
}

// Load all tasks
function loadTasks() {
  fetch(API_TASKS + "/all", {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(tasks => {
    // Sort tasks by ID in ascending order
    const sortedTasks = tasks.sort((a, b) => a.id - b.id);
    renderTasksTable(sortedTasks);
  })
  .catch(err => {
    console.error(err);
    document.getElementById("tasksTable").innerHTML = 
      '<tr><td colspan="7" style="color:#ef4444;">Error loading tasks</td></tr>';
  });
}

function renderTasksTable(tasks) {
  const tbody = document.getElementById("tasksTable");
  
  if (tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7">No tasks assigned yet</td></tr>';
    return;
  }

  tbody.innerHTML = tasks.map(task => `
    <tr>
      <td>${task.id}</td>
      <td>${task.title}</td>
      <td>
        ${task.status === 'Pending' ? `
          <select onchange="changeEmployee(${task.id}, this.value)" style="padding:5px 8px; font-size:13px; border-radius:4px; border:1px solid #cbd5e1; background:white; min-width:150px;">
            <option value="${task.employee_id}">${task.Employee ? task.Employee.name : 'N/A'}</option>
            ${allEmployees.filter(emp => emp.id !== task.employee_id).map(emp => `
              <option value="${emp.id}">${emp.name}</option>
            `).join('')}
          </select>
        ` : (task.Employee ? task.Employee.name : 'N/A')}
      </td>
      <td>
        <span style="background:${getPriorityColor(task.priority)}; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">
          ${task.priority}
        </span>
      </td>
      <td>${task.due_date ? new Date(task.due_date).toLocaleDateString() : 'N/A'}</td>
      <td>
        <span style="background:${task.status === 'Completed' ? '#22c55e' : '#f59e0b'}; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">
          ${task.status}
        </span>
      </td>
      <td>
        <button class="danger" onclick="deleteTask(${task.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

function getPriorityColor(priority) {
  switch(priority) {
    case 'High': return '#ef4444';
    case 'Medium': return '#f59e0b';
    case 'Low': return '#3b82f6';
    default: return '#6b7280';
  }
}

function openTaskForm() {
  document.getElementById("taskModal").style.display = "block";
  loadEmployees();
}

function closeTaskForm() {
  document.getElementById("taskModal").style.display = "none";
  document.getElementById("taskTitle").value = "";
  document.getElementById("taskDescription").value = "";
  document.getElementById("taskEmployee").value = "";
  document.getElementById("taskPriority").value = "Medium";
  document.getElementById("taskDueDate").value = "";
}

function assignTask() {
  const title = document.getElementById("taskTitle").value;
  const description = document.getElementById("taskDescription").value;
  const employee_id = document.getElementById("taskEmployee").value;
  const priority = document.getElementById("taskPriority").value;
  const due_date = document.getElementById("taskDueDate").value;

  if (!title || !employee_id) {
    alert("Title and Employee are required");
    return;
  }

  fetch(API_TASKS + "/create", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({
      title,
      description,
      employee_id: parseInt(employee_id),
      priority,
      due_date: due_date || null
    })
  })
  .then(res => res.json())
  .then(data => {
    alert("Task assigned successfully!");
    closeTaskForm();
    loadTasks();
  })
  .catch(err => {
    alert("Error assigning task");
    console.error(err);
  });
}

function deleteTask(taskId) {
  if (!confirm("Delete this task?")) return;
  
  fetch(`${API_TASKS}/${taskId}`, {
    method: 'DELETE',
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(() => {
    loadTasks();
  })
  .catch(err => {
    alert("Error deleting task");
    console.error(err);
  });
}

function changeEmployee(taskId, newEmployeeId) {
  if (!newEmployeeId) return;
  if (!confirm("Reassign this task to another employee?")) return;
  
  fetch(`${API_TASKS}/${taskId}/employee`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ employee_id: parseInt(newEmployeeId) })
  })
  .then(res => res.json())
  .then(() => {
    alert("Task reassigned successfully!");
    loadTasks();
  })
  .catch(err => {
    alert("Error reassigning task");
    console.error(err);
  });
}

// Load employees first, then tasks
fetch(API_EMPLOYEES, {
  headers: { Authorization: `Bearer ${token}` }
})
.then(res => res.json())
.then(employees => {
  allEmployees = employees;
  loadTasks();
})
.catch(err => {
  console.error("Error loading employees:", err);
});
</script>

</body>
</html>
